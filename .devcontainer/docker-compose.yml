services:
  postgres:
    image: postgres:16-alpine
    container_name: infraestructura-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-infraestructura}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-infraestructura}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: infraestructura-api-dev
    restart: unless-stopped
    user: node
    ports:
      - '${PORT:-3002}:${PORT:-3002}'
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
    volumes:
      - ..:/workspace:cached
      - /workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
    driver: local
