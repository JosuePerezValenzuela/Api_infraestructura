services:
  db:
    image: postgres:16-alpine
    container_name: infraestructura-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5433:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine3.23
    container_name: infraestructura-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: infraestructura-api-dev
    user: node
    tty: true
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      DB_HOST: db
    volumes:
      - ..:/workspace:cached
      - pnpm_store:/home/node/.local/share/pnpm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_dev_data:
    driver: local
  pnpm_store:
    driver: local
  redis_dev_data:
    driver: local
