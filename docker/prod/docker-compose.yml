services:
  postgres:
    image: postgres:16-alpine
    container_name: infraestructura-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-infraestructura}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-infraestructura}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: infraestructura-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
